        /* ── Share Overlay ── */
        #share-overlay {

            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);

            justify-content: center;

            width: 100%;

            background: #0b1120;
            border: 1px solid rgba(245,158,11,0.12);
            border-bottom: none;

            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            font-size: 18px;

            border: 1px solid rgba(245,158,11,0.25);

            font-weight: 700;
            letter-spacing: 0.06em;
            padding: 8px 18px;

            white-space: nowrap;
        }
        #copy-toast.show {

            from { opacity:0; transform: translateX(-50%) scale(0.9); }

    <script>
        const SHARE_URL  = window.location.href;
        const SHARE_TEXT = "🏆 Who's the real GOAT? Vote now in the Syrix GOAT Awards 2026 — the ultimate football debate is live! Cast your vote before voting closes 👇";
        const SHARE_HASHTAGS = "GOATAwards,Football,Syrix2026";

        function openShareOverlay() {
            document.getElementById("share-preview-url").textContent = SHARE_URL.length > 45 ? SHARE_URL.slice(0,45)+"…" : SHARE_URL;
            document.getElementById("share-overlay").classList.add("open");
            document.body.style.overflow = "hidden";
            // show native share if supported
            if (navigator.share) {
                document.getElementById("native-share-btn").style.display = "flex";
            }
            lucide.createIcons();
        }

        function closeShareOverlay(e) {
            if (e && e.target !== document.getElementById("share-overlay")) return;
            document.getElementById("share-overlay").classList.remove("open");
            document.body.style.overflow = "";
        }

        window.closeShareOverlay = closeShareOverlay;
        window.openShareOverlay  = openShareOverlay;

        // Close on Escape
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") closeShareOverlay({ target: document.getElementById("share-overlay") });
        });

        function shareViaWhatsApp() {
            const msg = encodeURIComponent(`${SHARE_TEXT}\n${SHARE_URL}`);
            window.open(`https://wa.me/?text=${msg}`, "_blank");
        }

        function shareViaTwitter() {
            const text = encodeURIComponent(SHARE_TEXT);
            const url  = encodeURIComponent(SHARE_URL);
            const tags = encodeURIComponent(SHARE_HASHTAGS);
            window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}&hashtags=${tags}`, "_blank");
        }

        function shareViaTelegram() {
            const text = encodeURIComponent(`${SHARE_TEXT}\n${SHARE_URL}`);
            window.open(`https://t.me/share/url?url=${encodeURIComponent(SHARE_URL)}&text=${encodeURIComponent(SHARE_TEXT)}`, "_blank");
        }

        // Intercept the browser's install event globally
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
    // Prevent the default browser banner from showing randomly
    e.preventDefault();
    deferredPrompt = e;
});

// Rewriting your Facebook function to handle App Installation
Function shareViaFacebook() {
            const url = encodeURIComponent(SHARE_URL);
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}&quote=${encodeURIComponent(SHARE_TEXT)}`, "_blank");
        }

        function copyShareLink() {
            const fullText = `${SHARE_TEXT}\n${SHARE_URL}`;
            navigator.clipboard.writeText(fullText).then(() => {
                // Visual feedback on button
                const label = document.getElementById("copy-label");
                label.textContent = "Copied!";
                label.style.color = "#f59e0b";
                setTimeout(() => { label.textContent = "Copy Link"; label.style.color = ""; }, 2000);

                // Toast
                const toast = document.getElementById("copy-toast");
                toast.classList.add("show");
                setTimeout(() => toast.classList.remove("show"), 2200);
            }).catch(() => {
                // Fallback
                const ta = document.createElement("textarea");
                ta.value = fullText;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand("copy");
                document.body.removeChild(ta);
            });
        }

        async function nativeShare() {
            try {
                await navigator.share({ title: "Syrix GOAT Awards 2026", text: SHARE_TEXT, url: SHARE_URL });
            } catch(e) { /* user cancelled */ }
        }

        window.shareViaWhatsApp  = shareViaWhatsApp;
        window.shareViaTwitter   = shareViaTwitter;
        window.shareViaTelegram  = shareViaTelegram;
        window.shareViaFacebook  = shareViaFacebook;
        window.copyShareLink     = copyShareLink;
        window.nativeShare       = nativeShare;
    </script>

            attackers: "https://www.effectivecpmnetwork.com/jz0wgq6t?key=f32ff86fd8ac2458f5609501ca4ce5a5",
            midfield: "https://www.effectivecpmnetwork.com/tkqdck8hek?key=7525a6f99d11360ada80010d1d4a1259",
            defense: "https://www.effectivecpmnetwork.com/gsp5czh1?key=8bd972d64b2d0b91f50bb9a523645582",
            goalkeeper: "https://www.effectivecpmnetwork.com/h0vkpri11?key=7bfd6214f87a8cdeb3f2e8767d4b5378",
            coach: "https://www.effectivecpmnetwork.com/z8u4ywdk?key=bbd8f4ee2f06396668fac6b6fd8309f1"
        };

        onValue(ref(db, 'adsterraSmartLinks'), (snapshot) => {
            const data = snapshot.val();
            if (data) adsterraSmartLinks = data;
        });

        let currentCategory = 'ultimate';
        let countdownTickerInterval = null;
        let currentDbRef = null;

        window.switchCategory = function(categoryKey) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active-tab'));
            document.getElementById(`tab-${categoryKey}`).classList.add('active-tab');
            bindCategoryRealtimeStream(categoryKey);
        };

        window.executeDatabaseVote = async function(playerId) {
            const lastVote = localStorage.getItem(`cooldown_${currentCategory}`);
            const now = new Date().getTime();
            
            if (lastVote && now < parseInt(lastVote)) return;

            const targetAdUrl = adsterraSmartLinks[currentCategory] || adsterraSmartLinks['ultimate'];
            window.open(targetAdUrl, '_blank');

            const targetPlayersRef = ref(db, `categories/${currentCategory}/players`);

            try {
                await runTransaction(targetPlayersRef, (playersData) => {
                    if (playersData) {
                        const keys = Object.keys(playersData);
                        for (let key of keys) {
                            if (playersData[key] && playersData[key].id === playerId) {
                                if (playersData[key].actualVotes === undefined) playersData[key].actualVotes = playersData[key].votes || 0;
                                if (playersData[key].riggedVotes === undefined) playersData[key].riggedVotes = 0;

                                playersData[key].actualVotes += 1;
                                playersData[key].votes = playersData[key].actualVotes + playersData[key].riggedVotes;
                                break;
                            }
                        }
                    }
                    return playersData;
                });

                const lockoutTime = now + (60 * 60 * 1000);
                localStorage.setItem(`cooldown_${currentCategory}`, lockoutTime.toString());
                checkAndApplyCooldown();

            } catch (error) {
                console.error("Vote handling sync failure:", error);
            }
        };

        window.handleChatSubmit = async function(event) {
            event.preventDefault();
            const usernameInput = document.getElementById("chat-username").value.trim();
            const messageInput = document.getElementById("chat-msg").value.trim();

            if(!usernameInput || !messageInput) return;

            localStorage.setItem("chat_username", usernameInput);

            try {
                await push(ref(db, 'messages'), {
                    username: usernameInput,
                    text: messageInput,
                    timestamp: serverTimestamp()
                });
                document.getElementById("chat-msg").value = "";
            } catch (err) {
                console.error("Chat message streaming write failure:", err);
            }
        };

        function bindCategoryRealtimeStream(categoryKey) {
            currentCategory = categoryKey;
            currentDbRef = ref(db, 'categories/' + categoryKey);

            onValue(currentDbRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                document.getElementById("current-category-title").innerText = data.title;
                document.getElementById("current-category-type").innerText = data.type;

                renderLeaderboard(data.players);
                initCategoryCountdown(data.endTime);
            });
        }

        function renderLeaderboard(playersObjectOrArray) {
            const grid = document.getElementById("player-leaderboard-grid");
            grid.innerHTML = "";

            const playersList = Array.isArray(playersObjectOrArray) 
                ? playersObjectOrArray.filter(p => p !== null) 
                : Object.values(playersObjectOrArray);

            const sortedPlayers = [...playersList].sort((a, b) => b.votes - a.votes);

            sortedPlayers.forEach((player, index) => {
                if (index === 4) {
                    grid.innerHTML += `
                        <div class="col-span-2 glass-card rounded-2xl p-4 flex flex-col items-center justify-center border border-dashed border-slate-800 bg-slate-950/20 min-h-[140px]">
                            <span class="text-[9px] text-slate-500 tracking-widest uppercase mb-1 font-bold">Trending Debate</span>
                            <div class="w-full h-full bg-slate-900/20 rounded-xl flex items-center justify-center text-xs text-slate-600 text-center px-4">
                                [ Adsterra Banner Code Position ]
                            </div>
                        </div>
                    `;
                }

                const isLeader = index === 0;
                const cardHTML = `
                    <div class="glass-card rounded-2xl p-4 flex flex-col items-center text-center relative overflow-hidden transition-all duration-300 ${isLeader ? 'border-amber-500/20 bg-amber-500/[0.005]' : 'hover:border-slate-800'}">
                        ${isLeader ? 
                            '<span class="absolute top-3 left-3 text-[9px] font-black text-amber-400 bg-amber-950/50 px-1.5 py-0.5 rounded border border-amber-500/20 tracking-wider">LEADER</span>' : 
                            `<span class="absolute top-3 left-3 text-[10px] font-mono font-bold text-slate-600">#${index + 1}</span>`
                        }
                        <div class="w-11 h-11 rounded-full bg-slate-900 border ${isLeader ? 'border-amber-500/30' : 'border-slate-800/80'} flex items-center justify-center mb-2.5 text-xs font-bold text-slate-400">
                            ${player.name.charAt(0)}
                        </div>
                        <h3 class="font-bold text-xs text-slate-300 tracking-wide truncate max-w-full">${player.name}</h3>
                        <p class="text-[10px] text-slate-500 mt-0.5 font-mono">${player.votes.toLocaleString()} pts</p>
                        
                        <button onclick="executeDatabaseVote('${player.id}')" 
                                id="btn-${player.id}"
                                class="vote-btn w-full mt-3.5 bg-slate-900 border border-slate-800 hover:border-slate-700 text-slate-300 text-[11px] font-bold py-2 px-3 rounded-xl transition-all cursor-pointer flex items-center justify-center gap-1">
                            <i data-lucide="check-square" class="w-3 h-3 text-amber-400"></i> VOTE
                        </button>
                    </div>
                `;
                grid.innerHTML += cardHTML;
            });

            lucide.createIcons();
            checkAndApplyCooldown();
        }

        function initCategoryCountdown(endTimeString) {
            if (countdownTickerInterval) clearInterval(countdownTickerInterval);
            const targetTime = new Date(endTimeString).getTime();

            function updateTicker() {
                const now = new Date().getTime();
                const diff = targetTime - now;

                if (diff <= 0) {
                    document.getElementById("category-closing-timer").innerText = "Voting Closed";
                    clearInterval(countdownTickerInterval);
                    return;
                }

                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

                document.getElementById("category-closing-timer").innerText = `${days}d ${hours}h ${mins}m left`;
            }
            updateTicker();
            countdownTickerInterval = setInterval(updateTicker, 60000);
        }

        function checkAndApplyCooldown() {
            const lastVote = localStorage.getItem(`cooldown_${currentCategory}`);
            if (!lastVote) return;

            const now = new Date().getTime();
            const timeLeft = parseInt(lastVote) - now;

            if (timeLeft <= 0) {
                localStorage.removeItem(`cooldown_${currentCategory}`);
                return;
            }

            const buttons = document.querySelectorAll('.vote-btn');
            const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

            buttons.forEach(btn => {
                btn.disabled = true;
                btn.className = "vote-btn w-full mt-3.5 bg-slate-950/40 text-slate-600 border border-slate-900/60 text-[10px] py-2 px-3 rounded-xl cursor-not-allowed flex items-center justify-center gap-1 font-mono";
                btn.innerHTML = `<i data-lucide="lock" class="w-3 h-3 text-slate-600"></i> ${minutes}m ${seconds}s`;
            });
            lucide.createIcons();
        }

        const chatFeed = document.getElementById("chat-messages-feed");
        if(localStorage.getItem("chat_username")) {
            document.getElementById("chat-username").value = localStorage.getItem("chat_username");
        }

        onValue(query(ref(db, 'messages'), limitToLast(120)), (snapshot) => {
            chatFeed.innerHTML = "";
            const data = snapshot.val();
            if (!data) {
                chatFeed.innerHTML = `<p class="text-slate-600 italic text-center text-[11px] mt-4">No chatter yet. Start the debate!</p>`;
                return;
            }

            Object.values(data).forEach(msg => {
                const msgBox = document.createElement("div");
                msgBox.className = "bg-slate-950/40 border border-slate-900/60 rounded-xl p-2.5 max-w-[90%] w-fit";
                msgBox.innerHTML = `
                    <div class="flex items-center gap-1.5 mb-0.5">
                        <span class="font-black text-amber-500/90 text-[10px] tracking-wide">${escapeHtml(msg.username)}</span>
                    </div>
                    <p class="text-slate-300 tracking-wide text-[11px] leading-relaxed break-all">${escapeHtml(msg.text)}</p>
                `;
                chatFeed.appendChild(msgBox);
            });
            chatFeed.scrollTop = chatFeed.scrollHeight;
        });

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        bindCategoryRealtimeStream('ultimate');
        setInterval(checkAndApplyCooldown, 1000);
    </script>
        <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Syrix PWA Service Worker linked successfully:', reg.scope))
                    .catch(err => console.error('PWA Service Worker registration failed:', err));
            });
        }

    </script>
    
</body>
</html>
